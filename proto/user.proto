syntax = "proto3";

service UserService {
    rpc login(LoginRequest) returns (LoginResult);
    rpc getUserByName(GetUserByNameRequest) returns (GetUserResult);
}

message GetUserResult {
    User user = 1;
}

message User {
    string username = 1;
    string email = 2;
}

message GetUserByNameRequest {
    string username = 1;
}

enum LoginCode {
    SUCCESS = 0;
    FAIL = 1;
};

message LoginResult {
    LoginCode loginCode = 1;
    optional string token = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}